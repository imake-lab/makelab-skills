    <rect class="step" x="672" y="300" width="316" height="38" rx="8"/><circle class="num" cx="693" cy="319" r="11"/><text class="numt" x="693" y="323">3</text><text class="st" x="712" y="324">核心链路 ≤8 · 测试现状（静态）</text>
