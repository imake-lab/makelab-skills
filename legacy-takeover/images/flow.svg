    <rect class="step" x="672" y="438" width="316" height="38" rx="8"/><circle class="num" cx="693" cy="457" r="11"/><text class="numt" x="693" y="461">6</text><text class="st" x="712" y="462">CI 配置（只生成，不推送）</text>
