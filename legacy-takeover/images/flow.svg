    <rect class="run" x="1032" y="418" width="326" height="38" rx="8"/><circle class="num" cx="1053" cy="437" r="11"/><text class="numt" x="1053" y="441">4</text><text class="rst" x="1072" y="442">锁老行为：Characterization Test</text>
    <rect class="run" x="1032" y="464" width="326" height="38" rx="8"/><circle class="num" cx="1053" cy="483" r="11"/><text class="numt" x="1053" y="487">5</text><text class="rst" x="1072" y="488">后端分批：DTO → Service → Controller</text>
    <rect class="run" x="1032" y="510" width="326" height="38" rx="8"/><circle class="num" cx="1053" cy="529" r="11"/><text class="numt" x="1053" y="533">6</text><text class="rst" x="1072" y="534">curl 验证 · 测试总数 = 基线 + 新增</text>
    <rect class="run" x="1032" y="556" width="326" height="38" rx="8"/><circle class="num" cx="1053" cy="575" r="11"/><text class="numt" x="1053" y="579">7</text><text class="rst" x="1072" y="580">前端：改前截图 → 改 → 构建 → 验证</text>
    <rect class="run" x="1032" y="602" width="326" height="38" rx="8"/><circle class="num" cx="1053" cy="621" r="11"/><text class="numt" x="1053" y="625">8</text><text class="rst" x="1072" y="626">代码独立 review · 回灌 ②③</text>
  </g>
