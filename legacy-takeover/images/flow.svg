    <rect class="step" x="312" y="392" width="316" height="38" rx="8"/><circle class="num" cx="333" cy="411" r="11"/><text class="numt" x="333" y="415">5</text><text class="st" x="352" y="416">疑点 + 风险地带（热点 · 无接缝）</text>
