    <rect class="run" x="672" y="530" width="316" height="38" rx="8"/><circle class="num" cx="693" cy="549" r="11"/><text class="numt" x="693" y="553">8</text><text class="rst" x="712" y="554">跑测试 · 分批补 P0 · 断言凭实际</text>
  </g>
