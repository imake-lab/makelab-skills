    <rect class="step" x="312" y="254" width="316" height="38" rx="8"/><circle class="num" cx="333" cy="273" r="11"/><text class="numt" x="333" y="277">2</text><text class="st" x="352" y="278">模块说明：职责 · 入口 · 表 · 风险</text>
