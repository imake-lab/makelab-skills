  <text class="outh" x="688" y="624">交付</text>
  <text class="outt" x="688" y="646">2-dev-setup.md · 3-test-guard.md</text>
  <text class="outt" x="688" y="666">scripts/dev-env.sh</text>
  <text class="outt" x="688" y="686">apply/：CI、env-bootstrap</text>

  <line x1="1001" y1="172" x2="1017" y2="172" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#ab)"/>

