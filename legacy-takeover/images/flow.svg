  <rect width="1610" height="1150" fill="#FBF7F0"/>

  <!-- 标题 -->
  <text x="40" y="54" font-size="30" font-weight="700" fill="#1F4E79">legacy-takeover 执行流程</text>
  <text x="40" y="84" font-size="15" fill="#6B6B6B">你只说一句话 · AI 按阶段自主推进 · 默认只读，虚线步骤要你说「跑起来」才做 · 黄色是需要你的地方 · 产出全部在 make-skill-legacy-takeover-output/</text>

